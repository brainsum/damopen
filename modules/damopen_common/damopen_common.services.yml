services:
  damopen_common.file_system:
    class: Drupal\damopen_common\Service\DamoFileSystem
    arguments:
      - '@stream_wrapper_manager'
      - '@settings'
      - '@logger.channel.file'
  damopen_common.workspace_theme:
    class: Drupal\damopen_common\Theme\WorkspaceThemeNegotiator
    arguments: ['@current_user', '@config.factory']
    tags:
      - { name: theme_negotiator, priority: 1100 }
