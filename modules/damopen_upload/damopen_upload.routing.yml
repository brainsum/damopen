damopen_upload.upload:
  path: '/upload-image'
  defaults:
    _controller: '\Drupal\damopen_upload\Controller\DamopenUploadController::upload'
    _title: 'Image upload'
  requirements:
    _permission: 'access content'

damopen_upload.image_form:
  path: '/upload-image-form'
  defaults:
    _form: '\Drupal\damopen_upload\Form\DamopenUploadForm'
    _title: 'Upload images'
  requirements:
    _permission: 'access content'
    _access: 'TRUE'

damopen_wfa.assets:
  path: '/waiting-for-approval'
  defaults:
    _controller: '\Drupal\damopen_upload\Controller\DamopenWfaController::waitingForApproval'
    _title: 'Assets Waiting for Approval'
  requirements:
    _permission: 'access media asset library'
