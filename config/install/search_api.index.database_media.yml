datasource_settings:
  'entity:media':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_status: {  }
  entity_type: {  }
  html_filter:
    weights:
      preprocess_index: -6
      preprocess_query: -6
    all_fields: false
    fields:
      - file_filename
      - files_filename
      - image_filename
      - images_filename
      - media_bundle
      - media_keywords_name
      - media_name
      - template_filename
      - video_filename
    title: true
    alt: true
    tags:
      b: 2
      h1: 5
      h2: 3
      h3: 2
      strong: 2
  ignorecase:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: true
    fields:
      - file_filename
      - files_filename
      - image_filename
      - images_filename
      - media_bundle
      - media_category_name
      - media_keywords_name
      - media_name
      - template_filename
      - video_filename
  language_with_fallback: {  }
  rendered_item: {  }
  stopwords:
    weights:
      preprocess_index: 0
      preprocess_query: 0
    all_fields: true
    fields:
      - file_filename
      - files_filename
      - image_filename
      - images_filename
      - media_bundle
      - media_category_name
      - media_keywords_name
      - media_name
      - template_filename
      - video_filename
    stopwords:
      - a
      - an
      - and
      - are
      - as
      - at
      - be
      - but
      - by
      - for
      - if
      - in
      - into
      - is
      - it
      - 'no'
      - not
      - of
      - 'on'
      - or
      - s
      - such
      - t
      - that
      - the
      - their
      - then
      - there
      - these
      - they
      - this
      - to
      - was
      - will
      - with
  tokenizer:
    weights:
      preprocess_index: 0
      preprocess_query: 0
    all_fields: true
    fields:
      - file_filename
      - files_filename
      - image_filename
      - images_filename
      - media_bundle
      - media_category_name
      - media_keywords_name
      - media_name
      - template_filename
      - video_filename
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
  transliteration:
    weights:
      preprocess_index: -10
      preprocess_query: -10
    all_fields: true
    fields:
      - file_filename
      - files_filename
      - image_filename
      - images_filename
      - media_bundle
      - media_category_name
      - media_keywords_name
      - media_name
      - template_filename
      - video_filename
  type_boost:
    weights:
      preprocess_index: -20
    boosts:
      'entity:media':
        datasource_boost: 1.0
        bundle_boosts:
          guideline: 0.0
          icon: 0.0
          image: 0.0
          logo: 0.0
          template: 0.0
          video: 0.0
          video_file: 0.0
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 500
  index_directly: true
  track_changes_in_references: true
server: local_database_server
